name: taxi_palestine_app
description: A Flutter client for the Service Taxi Reservation System in Palestine.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.0.9
  http: ^1.1.0
  shared_preferences: ^2.2.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  flutter_map: ^7.0.0
  geolocator: ^13.0.0
  supabase_flutter: ^2.0.0
  latlong2: ^0.9.1
  url_launcher: ^6.2.5
  fl_chart: ^0.69.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - images/

